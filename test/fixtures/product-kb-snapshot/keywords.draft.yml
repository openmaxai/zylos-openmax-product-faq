# keywords.yml — retrieval keywords for the openmax-product-faq skill (`kb.js ask`)
#
# Used ONLY by `kb.js ask` to map a customer question to the best 1–2 README sections.
# It is not shown to customers and does not change any answer text.
#
# Maintenance (content team):
#   - Update this file in the same PR that adds / renames a README section.
#   - Keys are section headings from README-zh.md (Chinese) or README.md (English).
#     Leading numbering ("5 ", "2.1 ") is optional; a key covers BOTH language files.
#   - strong: words / short phrases that clearly mean this section (weight 4).
#     weak:   words that hint at it but also appear elsewhere (weight 1.5).
#     Put Chinese and English terms in the same lists; matching is case-insensitive.
#   - Chinese terms match as substrings ("扣费" matches "会自动扣费吗"); keep them
#     2–6 characters and avoid generic words (支持 / 可以 / 怎么).
#   - synonyms: each group is treated as one concept — if a question contains any
#     member, all members are considered present.
#   - After merge, agents pick it up on their next sync (≤24h) — no release needed.
#     `kb.js status` lists keys that no longer match a heading ("Unresolved").
#
# Supported syntax: a simple YAML subset (mappings, `- item` lists, [a, b] lists, quotes, # comments).

version: 1

synonyms:
  积分: [credit, credits, 点数]
  套餐: [plan, plans, 订阅套餐]
